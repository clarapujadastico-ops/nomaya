<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #3D3457;">
  <h1 style="font-size: 22px; font-weight: 600; margin: 0 0 8px;">Welcome to Nomaya</h1>
  <p style="font-size: 15px; line-height: 1.5; color: #6B6480; margin: 0 0 24px;">
    Enter this code in the app to confirm your account:
  </p>
  <div style="background: #EFEAFB; border-radius: 16px; padding: 20px; text-align: center; margin: 0 0 24px;">
    <span style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #5F5095;">{{ .Token }}</span>
  </div>
  <p style="font-size: 13px; line-height: 1.5; color: #948CA6; margin: 0;">
    This code expires in 1 hour. If you didn't request this, you can safely ignore this email.
  </p>
</div>
